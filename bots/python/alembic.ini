# Конфигурация Alembic (миграции схемы БД).
# Запуск — из папки bots/python:
#   alembic upgrade head        # применить миграции
#   alembic revision --autogenerate -m "описание"   # новая миграция по изменениям моделей
# URL базы берётся из DATABASE_URL (.env) через core.config — здесь его НЕ указываем.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Логи идут через core.logger (консоль + LOG_FILE), своих секций логирования здесь нет.
